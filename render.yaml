services:
  - type: web
    name: vitalai
    runtime: node
    plan: free
    nodeVersion: "20"
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_AI
        value: false
      - key: GEMINI_API_KEY
        sync: false        # you'll set this in the Render dashboard
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_TO
        value: curiolightforyou@gmail.com
